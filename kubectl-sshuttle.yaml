apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sshuttle
spec:
  version: v0.1.0
  homepage: https://github.com/grafana/deployment_tools/tree/master/kubectl-sshuttle
  shortDescription: Tunnel traffic through a cluster using sshuttle
  description: |
    Manages a proxy pod in a Kubernetes cluster and uses sshuttle to tunnel
    traffic through it. This lets you reach IPs and subnets that are only
    accessible from inside the cluster.

    Requires sshuttle installed locally (pip install sshuttle).
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/grafana/deployment_tools/releases/download/kubectl-sshuttle-v0.1.0/kubectl-sshuttle-linux-amd64.tar.gz
      sha256: "PLACEHOLDER"
      bin: kubectl-sshuttle
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/grafana/deployment_tools/releases/download/kubectl-sshuttle-v0.1.0/kubectl-sshuttle-darwin-amd64.tar.gz
      sha256: "PLACEHOLDER"
      bin: kubectl-sshuttle
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/grafana/deployment_tools/releases/download/kubectl-sshuttle-v0.1.0/kubectl-sshuttle-darwin-arm64.tar.gz
      sha256: "PLACEHOLDER"
      bin: kubectl-sshuttle
