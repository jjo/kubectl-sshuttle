apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sshuttle
spec:
  version: v0.1.0
  homepage: https://github.com/jjo/kubectl-sshuttle
  shortDescription: Tunnel traffic through a cluster using sshuttle
  description: |
    Manages a proxy pod in a Kubernetes cluster and uses sshuttle to
    tunnel traffic through it. Lets you reach IPs and subnets that are
    only accessible from inside the cluster network.

    It deploys a lightweight proxy pod, then uses sshuttle with kubectl
    exec as the transport layer to create a transparent VPN tunnel.

    Requires sshuttle installed locally (pip install sshuttle).
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/jjo/kubectl-sshuttle/releases/download/v0.1.0/kubectl-sshuttle_Linux_x86_64.tar.gz
      sha256: "PLACEHOLDER_LINUX_AMD64"
      bin: kubectl-sshuttle
      files:
        - from: kubectl-sshuttle
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/jjo/kubectl-sshuttle/releases/download/v0.1.0/kubectl-sshuttle_Linux_arm64.tar.gz
      sha256: "PLACEHOLDER_LINUX_ARM64"
      bin: kubectl-sshuttle
      files:
        - from: kubectl-sshuttle
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/jjo/kubectl-sshuttle/releases/download/v0.1.0/kubectl-sshuttle_Darwin_x86_64.tar.gz
      sha256: "PLACEHOLDER_DARWIN_AMD64"
      bin: kubectl-sshuttle
      files:
        - from: kubectl-sshuttle
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/jjo/kubectl-sshuttle/releases/download/v0.1.0/kubectl-sshuttle_Darwin_arm64.tar.gz
      sha256: "PLACEHOLDER_DARWIN_ARM64"
      bin: kubectl-sshuttle
      files:
        - from: kubectl-sshuttle
          to: .
        - from: LICENSE
          to: .
