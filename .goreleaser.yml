version: 2

# Pre-build rushtle (Rust) so the per-platform binary is available when
# goreleaser builds archives. We can't use a `prebuilt` builder (not in
# v2.15) — instead, the script writes prebuilt/rushtle_<os>_<arch>/rushtle
# and the archive `files:` block below picks it up via templating.
before:
  hooks:
    - bash scripts/build-rushtle-prebuilt.sh

builds:
  - id: kubectl-sshuttle
    binary: kubectl-sshuttle
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/jjo/kubectl-sshuttle/cmd.version={{ .Version }}+{{ .ShortCommit }}

archives:
  - id: default
    # Embed the leading `v` in the archive filename so the
    # krew-release-bot template (`.TagName` = "v0.2.x") can use a single
    # `addURIAndSha` URL pattern for both the path component and the
    # filename. Without this, the path uses `v0.2.x` but the filename
    # uses `0.2.x`, requiring sprig template tricks to bridge.
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - src: "prebuilt/rushtle_{{ .Os }}_{{ .Arch }}/rushtle"
        dst: rushtle
        info:
          mode: 0755

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
